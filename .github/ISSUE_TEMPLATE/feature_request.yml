name: 💡 Suggest a feature
description: An idea for new animals, seasons, surprises or game modes.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love ideas! This form is **public**. Please don't include personal information.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see in Wild Seasons?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
    validations:
      required: false
